name: Deploy to Development

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:


env:
  REGION: us-central1
  SERVICE_NAME: lyrian-stripe

jobs:
  test:
    # Skip PRs opened from forks so outside contributors can't run code on our CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: development
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyrian_billing_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run unit tests
      run: yarn test:unit

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
      run: npx prisma migrate deploy

    - name: Run integration tests
      env:
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
        SAAS_JWT_SECRET: ci-test-jwt-secret
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: npx vitest run

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
        SAAS_JWT_SECRET: ci-test-jwt-secret
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        NODE_ENV: development
        ENABLE_E2E_SHORTCUTS: "true"
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-dev
        path: playwright-report/
        retention-days: 7

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Container
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --min-instances=1 \
          --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
          --set-env-vars "NODE_ENV=production,BILLING_APP_URL=${{ secrets.BILLING_APP_URL }},ENABLE_E2E_SHORTCUTS=true" \
          --set-secrets "DATABASE_URL=DATABASE_URL:latest,SAAS_JWT_SECRET=SAAS_JWT_SECRET:latest,CRON_SECRET=CRON_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FIELD_ENCRYPTION_KEY=FIELD_ENCRYPTION_KEY:latest"

  migrate:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    environment: development

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install Cloud SQL Auth Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

    - name: Run Prisma Migrations
      env:
        DATABASE_URL: ${{ secrets.DB_MIGRATE_URL }}
      run: |
        ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port 5432 &
        for i in $(seq 1 15); do
          nc -z localhost 5432 && break
          echo "Waiting for Cloud SQL proxy... ($i/15)"
          sleep 2
        done
        npx prisma migrate deploy

  webhook-sanity-check:
    runs-on: ubuntu-latest
    needs: migrate
    environment: development

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install Cloud SQL Auth Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

    - name: Schema sanity check
      env:
        DATABASE_URL: ${{ secrets.DB_MIGRATE_URL }}
        SAAS_JWT_SECRET: ${{ secrets.SAAS_JWT_SECRET }}
        BILLING_APP_URL: ${{ secrets.BILLING_APP_URL }}
      run: |
        ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port 5432 &
        for i in $(seq 1 15); do
          nc -z localhost 5432 && break
          echo "Waiting for Cloud SQL proxy... ($i/15)"
          sleep 2
        done
        npx tsx scripts/schema-sanity-check.ts

    - name: Stripe webhook signature sanity check
      env:
        DATABASE_URL: ${{ secrets.DB_MIGRATE_URL }}
        SAAS_JWT_SECRET: ${{ secrets.SAAS_JWT_SECRET }}
        BILLING_APP_URL: ${{ secrets.BILLING_APP_URL }}
        FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      run: npx tsx scripts/webhook-sanity-check.ts
