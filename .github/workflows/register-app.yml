name: Register App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev or production)'
        required: true
        type: choice
        options:
        - dev
        - production
      app_id:
        description: 'App ID (e.g., threads_app)'
        required: true
        type: string
      app_name:
        description: 'App Display Name (e.g., Threads App)'
        required: true
        type: string
      plans_file:
        description: 'Plans JSON filename in repo root (e.g., threads_app_plans_dev.json for staging, threads_app_plans_prod.json for production)'
        required: true
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  register-app:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install Cloud SQL Auth Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

    - name: Register App with Plans
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SAAS_JWT_SECRET: ${{ secrets.SAAS_JWT_SECRET }}
        STRIPE_PK_KEY: ${{ secrets.STRIPE_PK_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port 5432 &
        sleep 5

        echo "🌍 Environment: ${{ inputs.environment }}"
        echo "📝 Registering app: ${{ inputs.app_id }}"
        echo "📄 Using plans file: ${{ inputs.plans_file }}"

        # Run the create-app script
        npx tsx scripts/create-app.ts "${{ inputs.app_id }}" "${{ inputs.app_name }}" "./${{ inputs.plans_file }}"

        echo ""
        echo "⚠️  IMPORTANT: Copy the API key from the output above!"
        echo "⚠️  It will NOT be shown again!"
