name: Register App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (development, stage, or prod)'
        required: true
        type: choice
        options:
        - development
        - stage
        - prod
      app_id:
        description: 'App ID (e.g., threads_app)'
        required: true
        type: string
      app_name:
        description: 'App Display Name (e.g., Threads App)'
        required: true
        type: string
      plans_file:
        description: 'Plans JSON filename in repo root (e.g., threads_app_plans_dev.json for staging, threads_app_plans_prod.json for production)'
        required: true
        type: string
      resend_api_key:
        description: 'Resend API key for this app (re_live_...). Leave blank to use the billing portal default.'
        required: false
        type: string
      from_email:
        description: 'Sending email address for this app (e.g., billing@yourapp.com). Leave blank to use the billing portal default.'
        required: false
        type: string
      stripe_secret_key:
        description: 'Stripe secret key for this app (sk_live_... or sk_test_...). Leave blank to use the billing portal default.'
        required: false
        type: string
      stripe_publishable_key:
        description: 'Stripe publishable key for this app (pk_live_... or pk_test_...). Leave blank to use the billing portal default.'
        required: false
        type: string
      stripe_webhook_secret:
        description: 'Stripe webhook signing secret for this app (whsec_...). Leave blank to use the billing portal default.'
        required: false
        type: string
      saas_jwt_secret:
        description: 'JWT signing secret used by this SaaS app to sign billing tokens. Leave blank to use the global SAAS_JWT_SECRET.'
        required: false
        type: string
      custom_domain:
        description: 'Custom domain for this app''s billing portal (e.g. billing.saas-a.com). Leave blank to use the shared billing service URL.'
        required: false
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  register-app:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install Cloud SQL Auth Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

    - name: Register App with Plans
      env:
        DATABASE_URL: ${{ secrets.DB_MIGRATE_URL }}
        APP_RESEND_API_KEY: ${{ inputs.resend_api_key }}
        APP_FROM_EMAIL: ${{ inputs.from_email }}
        APP_STRIPE_SECRET_KEY: ${{ inputs.stripe_secret_key }}
        APP_STRIPE_PK_KEY: ${{ inputs.stripe_publishable_key }}
        APP_STRIPE_WEBHOOK_SECRET: ${{ inputs.stripe_webhook_secret }}
        APP_SAAS_JWT_SECRET: ${{ inputs.saas_jwt_secret }}
        APP_CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
      run: |
        # Mask sensitive values immediately so they never appear in plain text in the logs
        if [ -n "$APP_RESEND_API_KEY" ]; then
          echo "::add-mask::$APP_RESEND_API_KEY"
        fi
        if [ -n "$APP_STRIPE_SECRET_KEY" ]; then
          echo "::add-mask::$APP_STRIPE_SECRET_KEY"
        fi
        if [ -n "$APP_STRIPE_PK_KEY" ]; then
          echo "::add-mask::$APP_STRIPE_PK_KEY"
        fi
        if [ -n "$APP_STRIPE_WEBHOOK_SECRET" ]; then
          echo "::add-mask::$APP_STRIPE_WEBHOOK_SECRET"
        fi
        if [ -n "$APP_SAAS_JWT_SECRET" ]; then
          echo "::add-mask::$APP_SAAS_JWT_SECRET"
        fi

        ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port 5432 &
        sleep 5

        echo "🔄 Running database migrations..."
        npx prisma migrate deploy

        echo "🌍 Environment: ${{ inputs.environment }}"
        echo "📝 Registering app: ${{ inputs.app_id }}"
        echo "📄 Using plans file: ${{ inputs.plans_file }}"

        PLANS_FILE="./${{ inputs.plans_file }}"

        # If email credentials were provided, wrap the plans array in the object format on the fly
        if [ -n "$APP_RESEND_API_KEY" ] || [ -n "$APP_FROM_EMAIL" ]; then
          echo "📧 Injecting email config..."
          MERGED=$(node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const plans = Array.isArray(raw) ? raw : raw.plans;
            const config = { plans };
            if (process.env.APP_RESEND_API_KEY) config.resendApiKey = process.env.APP_RESEND_API_KEY;
            if (process.env.APP_FROM_EMAIL)     config.fromEmail    = process.env.APP_FROM_EMAIL;
            console.log(JSON.stringify(config));
          " "$PLANS_FILE")
          PLANS_FILE=$(mktemp /tmp/plans-XXXXXX.json)
          echo "$MERGED" > "$PLANS_FILE"
        fi

        # Run the create-app script
        npx tsx scripts/create-app.ts "${{ inputs.app_id }}" "${{ inputs.app_name }}" "$PLANS_FILE"

        echo ""
        echo "⚠️  IMPORTANT: Copy the API key from the output above!"
        echo "⚠️  It will NOT be shown again!"

    - name: Set up Cloud SDK
      if: ${{ inputs.custom_domain != '' }}
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        install_components: beta

    - name: Map custom domain to Cloud Run service
      if: ${{ inputs.custom_domain != '' }}
      run: |
        # Derive the Cloud Run service name from the target environment
        case "${{ inputs.environment }}" in
          development) SERVICE="lyrian-stripe" ;;
          stage)       SERVICE="lyrian-stripe-stage" ;;
          prod)        SERVICE="lyrian-stripe-prod" ;;
        esac

        echo "🌐 Mapping ${{ inputs.custom_domain }} → Cloud Run service: $SERVICE"

        # gcloud domain-mappings lives in the beta component. The GitHub-hosted
        # runner's pre-installed gcloud doesn't include it, so install it here.
        # --quiet auto-accepts the confirmation prompt.
        gcloud components install beta --quiet

        # Create the domain mapping (idempotent — safe to re-run).
        gcloud beta run domain-mappings create \
          --service "$SERVICE" \
          --domain "${{ inputs.custom_domain }}" \
          --region us-central1 \
          --project ${{ secrets.GCP_PROJECT_ID }} \
          --quiet || true

        echo ""
        echo "📋 DNS records to configure for ${{ inputs.custom_domain }}:"
        gcloud beta run domain-mappings describe \
          --domain "${{ inputs.custom_domain }}" \
          --region us-central1 \
          --project ${{ secrets.GCP_PROJECT_ID }} \
          --format="table(resourceRecords.type,resourceRecords.name,resourceRecords.rrdata)" 2>/dev/null || \
        echo "   (DNS records will appear once the mapping is provisioned — may take a minute)"
        echo ""
        echo "   Point the above DNS record(s) at your domain registrar, then TLS will be"
        echo "   provisioned automatically by Cloud Run (may take up to 15 minutes)."
