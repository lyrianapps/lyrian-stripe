name: Deploy to Cloud Run

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:


env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: lyrian-stripe

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyrian_billing_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
      run: npx prisma migrate deploy

    - name: Run unit/integration tests
      env:
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
        SAAS_JWT_SECRET: ${{ secrets.SAAS_JWT_SECRET }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PK_KEY: ${{ secrets.STRIPE_PK_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        STRIPE_FREE_PRICE_ID: ${{ secrets.STRIPE_FREE_PRICE_ID }}
        STRIPE_BASIC_PRICE_ID: ${{ secrets.STRIPE_BASIC_PRICE_ID }}
        STRIPE_FREE_PRODUCT_ID: ${{ secrets.STRIPE_FREE_PRODUCT_ID }}
        STRIPE_BASIC_PRODUCT_ID: ${{ secrets.STRIPE_BASIC_PRODUCT_ID }}
        NEXT_PUBLIC_APP_URL: http://localhost:3000
      run: yarn test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      env:
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyrian_billing_test
        SAAS_JWT_SECRET: ${{ secrets.SAAS_JWT_SECRET }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PK_KEY: ${{ secrets.STRIPE_PK_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        STRIPE_FREE_PRICE_ID: ${{ secrets.STRIPE_FREE_PRICE_ID }}
        STRIPE_BASIC_PRICE_ID: ${{ secrets.STRIPE_BASIC_PRICE_ID }}
        STRIPE_FREE_PRODUCT_ID: ${{ secrets.STRIPE_FREE_PRODUCT_ID }}
        STRIPE_BASIC_PRODUCT_ID: ${{ secrets.STRIPE_BASIC_PRODUCT_ID }}
        NEXT_PUBLIC_APP_URL: http://localhost:3000
      run: yarn test:e2e

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Container
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production" \
          --set-secrets "DATABASE_URL=DATABASE_URL:latest,SAAS_JWT_SECRET=SAAS_JWT_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,STRIPE_PK_KEY=STRIPE_PK_KEY:latest,STRIPE_FREE_PRICE_ID=STRIPE_FREE_PRICE_ID:latest,STRIPE_BASIC_PRICE_ID=STRIPE_BASIC_PRICE_ID:latest,STRIPE_FREE_PRODUCT_ID=STRIPE_FREE_PRODUCT_ID:latest,STRIPE_BASIC_PRODUCT_ID=STRIPE_BASIC_PRODUCT_ID:latest,CRON_SECRET=CRON_SECRET:latest"

  migrate:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Install dependencies
      run: npm ci

    - name: Run migrations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npx prisma migrate deploy
