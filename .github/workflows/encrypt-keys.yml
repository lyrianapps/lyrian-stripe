name: Encrypt Stripe Credentials

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would change without writing)"
        required: false
        default: "false"
        type: choice
        options:
        - "false"
        - "true"

env:
  REGION: us-central1

jobs:
  encrypt-keys:
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install Cloud SQL Auth Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

    - name: Start Cloud SQL Proxy
      run: |
        ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port 5432 &
        for i in $(seq 1 15); do
          nc -z localhost 5432 && break
          echo "Waiting for Cloud SQL proxy... ($i/15)"
          sleep 2
        done

    - name: Encrypt plain-text Stripe credentials
      env:
        DATABASE_URL: ${{ secrets.DB_MIGRATE_URL }}
        FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: npx tsx scripts/encrypt-existing-keys.ts
